# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# The Rust gate: format, check, clippy, and tests, the cargo half of `just verify` (its recipes
# also run pnpm and rumdl). Kache caches the compiler work; the action keeps its store in the
# GitHub Actions cache between runs.
name: rust

on:
  push:
    paths:
      - 'apps/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the toolchain and components `rust-toolchain.toml` pins; kache probes rustc next.
      - run: rustup toolchain install

      # Sets RUSTC_WRAPPER=kache for the job. The PR comment needs `pull-requests: write`, which
      # this workflow does not grant; the stats still go to the job summary.
      - uses: kunobi-ninja/kache-action@061011817fd04b0e460f79d6bb3c115b1fc8f029 # v1
        with:
          pr-comment: false

      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
