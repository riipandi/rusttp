# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# The uilibs gate: typecheck, the docs check and the Storybook build in one job, and the three
# test projects (every story with its axe check in light and dark, and the unit project) in
# parallel, one runner each. Pushes and pull requests run it in Chromium when the library
# changes; a nightly run repeats the stories and the unit tests in Firefox and WebKit, and runs the
# stories once more in Chromium through the React Compiler, as the webapp ships the library.
name: uilibs

on:
  push:
    paths:
      - 'packages/uilibs/**'
      - 'packages/plugins/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/uilibs.yml'
  pull_request:
    paths:
      - 'packages/uilibs/**'
      - 'packages/plugins/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/uilibs.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uilibs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter uilibs typecheck
      # Props tables and Playground controls against the code; reads source only, so no browser.
      - run: pnpm --filter uilibs check:docs
      # The checker's own test: it must report a drifted fixture, so a silent checker fails here.
      - run: pnpm --filter uilibs check:docs:test
      - run: pnpm --filter uilibs storybook:build

  tests:
    name: Tests (${{ matrix.project }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [storybook, storybook-dark, unit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - run: pnpm install --frozen-lockfile

      # The browser download is cached by the Playwright version; the system libraries are not
      # part of the cache, so a hit still installs them.
      - id: playwright
        run: echo "version=$(pnpm --filter uilibs exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter uilibs exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter uilibs exec playwright install-deps chromium

      - run: pnpm --filter uilibs exec vitest run --project ${{ matrix.project }}
      # `.vitest` is a hidden directory, so the action needs `include-hidden-files`; without it the upload is empty.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uilibs-failure-screenshots-${{ matrix.project }}
          path: packages/uilibs/.vitest/attachments
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  engines:
    name: Stories (${{ matrix.browser }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter uilibs exec playwright install --with-deps ${{ matrix.browser }}
      # Every project, as the push gate runs them in Chromium: the unit tests touch cookies, storage,
      # and CSS parsing, which differ by engine. `webkit` skips the stories tagged `skip-webkit`
      # (the Menubar `Playground`, F-12), see `vite.config.ts`.
      - run: pnpm --filter uilibs exec vitest run
        env:
          STORYBOOK_TEST_BROWSER: ${{ matrix.browser }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uilibs-failure-screenshots-${{ matrix.browser }}
          path: packages/uilibs/.vitest/attachments
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # `STORYBOOK_COMPILER=1` (`.storybook/main.ts`) compiles the library with the React Compiler and
  # makes it report every component it skips. A skipped component is not a failure: the job fails
  # only when a story does, and lists the skipped files in the run summary.
  compiler:
    name: Stories (React Compiler)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter uilibs exec playwright install --with-deps chromium
      - run: |
          set -o pipefail
          pnpm --filter uilibs exec vitest run --project storybook --project storybook-dark 2>&1 | tee "$RUNNER_TEMP/compiler.log"
        env:
          STORYBOOK_COMPILER: '1'
      - if: always()
        run: |
          {
            echo '### Files the React Compiler skipped'
            grep -h '^  File: ' "$RUNNER_TEMP/compiler.log" | sed 's|.*/packages/uilibs/||' | sort -u | sed 's/^/- `/; s/$/`/' || true
          } >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uilibs-failure-screenshots-compiler
          path: packages/uilibs/.vitest/attachments
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
