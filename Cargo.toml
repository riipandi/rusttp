[workspace]
resolver = "2"
members = ["apps/*", "crates/*"]
default-members = ["apps/server"]
exclude = []

[workspace.package]
repository = "https://github.com/riipandi/rusttp"
license = "Apache-2.0"
rust-version = "1.100"
version = "0.0.0"
edition = "2024"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "deny"
private_interfaces = "deny"

[workspace.dependencies]
axum = "0.8.9"
clap = { version = "4.6.8", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
