[workspace]
resolver = "2"
members = [
  "src-app",
  "crates/lib-mailer",
  "crates/lib-queue",
  "crates/identity",
  "crates/lib-observer",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
homepage = "https://github.com/riipandi/rusttp"
repository = "https://github.com/riipandi/rusttp"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1.0.103"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
fastrace = "0.7.18"
fastrace-axum = "0.2.0"
fastrace-opentelemetry = "0.18.1"
log = { version = "0.4.33", features = ["std"] }
logforth = { version = "0.30.1", features = ["starter-log", "append-async"] }
opentelemetry = "0.32.0"
opentelemetry-otlp = "0.32.0"
opentelemetry_sdk = "0.32.1"
rand = "0.10.2"
rust-embed = "8.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "net",
  "signal",
  "sync",
  "time",
] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.7.0", features = ["catch-panic"] }
uuid = { version = "1.23.4", features = ["v7", "serde"] }

[profile.release]
opt-level = 2 # Optimization level: 2 = balanced runtime perf vs compile time
lto = true # Full LTO: max cross-crate inlining, smaller & faster binary
codegen-units = 1 # Single unit per crate: LLVM optimises whole crate at once
panic = "abort" # Removes unwind tables — smaller binary, cannot catch panics
strip = "symbols" # Strip all symbols from final binary
debug = false # No debug symbols in release

[profile.release.build-override]
opt-level = 0 # build.rs only — no need to optimise
codegen-units = 16 # Keep build script fast

[profile.dev]
incremental = true # Incremental: rebuild only changed code — much faster iteration
debug = "limited" # Limited debug info: line numbers only, no type/variable debug
