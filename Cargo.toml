[workspace]
resolver = "2"
members = ["apps/*", "crates/*"]
default-members = ["apps/server"]
exclude = []

[workspace.package]
repository = "https://github.com/riipandi/rusttp"
license = "Apache-2.0"
rust-version = "1.100"
version = "0.0.0"
edition = "2024"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "deny"
private_interfaces = "deny"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "tracing"] }
clap = { version = "4.6.8", features = ["derive"] }
connectrpc = { version = "0.9.1", default-features = false, features = ["axum", "json"] }
memory-serve = "2.4.0"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.7.1", features = ["catch-panic", "trace"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt"] }
