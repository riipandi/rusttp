[workspace]
resolver = "2"
members = [
    "src-app",
    "crates/lib-mailer",
    "crates/lib-queue",
    "crates/identity",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
homepage = "https://github.com/riipandi/rusttp"
repository = "https://github.com/riipandi/rusttp"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["chrono", "env-filter", "json", "registry"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
