proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

# ------------------------------------------------------------------------------
# Silo S3 API and console, on the ports Silo itself would publish.
# ------------------------------------------------------------------------------
server {
    listen 9100;
    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;
    location / {
        proxy_pass http://silo:9100;
    }
}

server {
    listen 9101;
    location / {
        proxy_pass http://silo:9101;
        # A proxy_set_header here drops the ones inherited from above.
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ------------------------------------------------------------------------------
# Silo CDN: the public devbucket served read-only, plain and over TLS.
# ------------------------------------------------------------------------------
server {
    listen 9180;
    listen 9143 ssl;
    ssl_certificate /etc/nginx/certs/localhost_crt.pem;
    ssl_certificate_key /etc/nginx/certs/localhost_key.pem;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag" always;
    location / {
        limit_except GET HEAD OPTIONS { deny all; }
        proxy_pass http://silo:9100/devbucket/;
    }
    location = /stub_status {
        stub_status;
    }
}

# ------------------------------------------------------------------------------
# TLS front for the mock identity providers. The OAuth client holds every
# provider endpoint to https; the mock derives its issuer URLs from the
# forwarded proto and port, and answers http:// without them.
# ------------------------------------------------------------------------------
server {
    listen 3220 ssl;
    ssl_certificate /etc/nginx/certs/localhost_crt.pem;
    ssl_certificate_key /etc/nginx/certs/localhost_key.pem;
    location / {
        proxy_pass http://mock-oauth2:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 3220;
    }
}

# ------------------------------------------------------------------------------
# TLS front for the application running on the host.
# ------------------------------------------------------------------------------
server {
    http2 on;
    listen 3443 ssl;
    ssl_certificate /etc/nginx/certs/localhost_crt.pem;
    ssl_certificate_key /etc/nginx/certs/localhost_key.pem;
    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
