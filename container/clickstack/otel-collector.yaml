# Extra collector config, merged over the one the all-in-one generates from its
# team and sources (CUSTOM_OTELCOL_CONFIG_FILE in the supervisor template).
#
# The generated config scrapes the collector itself and ClickHouse into its own
# metrics pipeline; this adds a second receiver for the Redis exporter, a third
# for cAdvisor, and a fourth for the PostgreSQL exporter, each with its own
# pipeline, so naming those scrapes `redis`/`cadvisor`/`postgres` cannot relabel
# anything else.
receivers:
  prometheus/redis:
    config:
      scrape_configs:
        - job_name: redis
          scrape_interval: 30s
          static_configs:
            - targets: ["redis-exporter:9121"]

  prometheus/cadvisor:
    config:
      scrape_configs:
        - job_name: cadvisor
          scrape_interval: 30s
          static_configs:
            - targets: ["cadvisor:8080"]

  prometheus/postgres:
    config:
      scrape_configs:
        - job_name: postgres
          scrape_interval: 30s
          static_configs:
            - targets: ["postgres-exporter:9187"]

processors:
  # Dashboards group by ServiceName; without this every Redis series
  # would land under the collector's own service name.
  resource/redis:
    attributes:
      - key: service.name
        value: redis
        action: upsert

  resource/cadvisor:
    attributes:
      - key: service.name
        value: cadvisor
        action: upsert

  resource/postgres:
    attributes:
      - key: service.name
        value: postgres
        action: upsert

service:
  pipelines:
    metrics/redis:
      receivers: [prometheus/redis]
      processors: [memory_limiter, resource/redis, batch]
      exporters: [clickhouse]
    metrics/cadvisor:
      receivers: [prometheus/cadvisor]
      processors: [memory_limiter, resource/cadvisor, batch]
      exporters: [clickhouse]
    metrics/postgres:
      receivers: [prometheus/postgres]
      processors: [memory_limiter, resource/postgres, batch]
      exporters: [clickhouse]
