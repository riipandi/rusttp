# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

# Demo services, behind the `demo` profile:
#   docker compose -f container/compose.yaml --profile demo up -d

x-common: &common
  networks: ["intranet"]
  extra_hosts: ["host.docker.internal:host-gateway"]
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cpus: 1.0
  healthcheck:
    start_period: 10s
    interval: 1m30s
    timeout: 10s
    retries: 3

services:
  pocketbase:
    <<: *common
    profiles: ["demo"]
    build:
      context: ./pocketbase
      dockerfile: Dockerfile.pocketbase
      args:
        PB_VERSION: ${PB_VERSION:-0.42.3}
        DISTROLESS_TAG: debug-nonroot
    image: rusttp-pocketbase:${PB_VERSION:-0.42.3}-debug
    hostname: pocketbase
    ports: ["${PB_PORT:-9090}:9090"]
    volumes: ["pocketbase_data:/data:rw"]
    environment:
      # Exactly 32 characters; PocketBase encrypts the app settings with it.
      PB_ENCRYPTION_KEY: ${PB_ENCRYPTION_KEY:-secretRandWithExcact32Characters}
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:-admin@example.com}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:-@Password123!}
    configs: [{ source: pocketbase_superuser, target: /app/superuser.sh }]
    post_start:
      - command: /busybox/sh /app/superuser.sh
    shm_size: 128m
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "/busybox/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/api/health"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3

  # OIDC provider; Create the first admin (passkey) at https://localhost:1411/setup
  # @ref: https://pocket-id.org/docs/setup/installation
  # @ref: https://pocket-id.org/docs/advanced/hardening
  pocket-id:
    <<: *common
    profiles: ["demo"]
    image: ghcr.io/pocket-id/pocket-id:${POCKETID_VERSION:-v2}
    hostname: pocket-id
    expose: ["1411"]
    volumes: ["pocketid_data:/app/data:rw"]
    environment:
      APP_URL: https://localhost:1411
      # At least 16 characters; encrypts the stored secrets, so changing it breaks existing data.
      ENCRYPTION_KEY: ${POCKETID_ENCRYPTION_KEY:-secretEncryptionMinimal16Chars}
      TRUST_PROXY: true
      ANALYTICS_DISABLED: true
      VERSION_CHECK_DISABLED: true
    read_only: true
    tmpfs: ["/tmp"]
    shm_size: 32m
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3

configs:
  pocketbase_superuser:
    content: |
      #!/busybox/sh
      set -eu
      until /busybox/wget -q -O /dev/null http://127.0.0.1:9090/api/health; do sleep 1; done
      /app/pocketbase superuser upsert "$$PB_SUPERUSER_EMAIL" "$$PB_SUPERUSER_PASSWORD" \
        --dir=/data/pb_data --encryptionEnv=PB_ENCRYPTION_KEY

volumes:
  pocketbase_data:
  pocketid_data:

networks:
  intranet:
    driver: bridge
    enable_ipv6: false
